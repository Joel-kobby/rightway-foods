services:
  - type: web
    name: rightway-foods
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build && npx ts-node --project tsconfig.seed.json scripts/post-deploy.ts && npx ts-node --project tsconfig.seed.json scripts/update-pricing.ts
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
