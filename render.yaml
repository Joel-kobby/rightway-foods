services:
  - type: web
    name: rightway-foods
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && node scripts/reset-passwords.js && node scripts/update-pricing.js && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
